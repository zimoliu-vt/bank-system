<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create a card · Bank System</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="nav"><a class="brand" href="/"><span class="icon">◆</span> Bank System</a><nav><a href="/login"><span class="icon">◉</span> Login</a><a class="active" href="/register"><span class="icon">＋</span> Create card</a><a href="/api"><span class="icon">⌘</span> API</a></nav></header>
<main class="auth-page"><form method="post" class="panel auth-card"><span class="eyebrow">NEW CARD</span><h1>Create your card</h1><p>Your card starts at exactly zero and can receive money after it is created.</p>{% if error %}<div class="notice error">{{ error }}</div>{% endif %}<label>Cardholder name<input name="holder" required maxlength="100" autocomplete="name" value="{{ values.get('holder','') }}" placeholder="Alex Tan"></label><label>Card label<input name="label" maxlength="80" value="{{ values.get('label','') }}" placeholder="Everyday card"></label><label>Currency<select name="currency" id="new-card-currency">{% for currency in ['SGD','USD','EUR','GBP','CNY'] %}<option{% if values.get('currency') == currency %} selected{% endif %}>{{ currency }}</option>{% endfor %}</select><small id="detected-currency"></small></label><label>Password<input name="password" type="password" minlength="10" maxlength="200" autocomplete="new-password" required><small>Use at least 10 characters.</small></label><label>Confirm password<input name="confirm_password" type="password" minlength="10" maxlength="200" autocomplete="new-password" required></label><button class="button primary full" type="submit"><span class="action-icon">＋</span> Create zero-balance card</button><p class="auth-switch">Already have a card? <a href="/login">Log in</a>.</p></form></main><script src="{{ url_for('static', filename='region-currency.js') }}"></script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payments · Bank System</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="nav"><a class="brand" href="/">Bank System</a><nav><a class="active" href="/payments">Payments</a><a href="/management">Management</a><a href="/api">API</a></nav></header>
<main class="page payment-page"><span class="eyebrow">SECURE TRANSFER</span><h1>Send a payment</h1><p class="lead">Use the sender card's API key. The key is used for this request only and is not saved in the browser.</p>
<form id="payment-form" class="panel payment-form"><div class="form-row"><label>From card ID<input name="from_card_id" type="number" min="1" required placeholder="1"></label><label>To card ID<input name="to_card_id" type="number" min="1" required placeholder="2"></label></div><label>Sender API key<input name="api_key" type="password" autocomplete="off" required placeholder="bank_card_..."></label><div class="form-row"><label>Amount<input name="amount" type="number" min="0.01" step="0.01" required placeholder="25.00"></label><label>Description<input name="description" maxlength="160" placeholder="Lunch"></label></div><button class="button primary" type="submit">Send payment</button></form><div id="payment-result" class="notice hidden"></div></main><script src="{{ url_for('static', filename='payments.js') }}"></script></body></html>

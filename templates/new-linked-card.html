<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New linked card · Bank System</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="nav"><a class="brand" href="/account"><span class="icon">◆</span> Bank System</a><nav><a href="/account"><span class="icon">⌂</span> Account</a><a href="/payments"><span class="icon">➜</span> Pay</a><a href="/exchange"><span class="icon">⇄</span> Exchange</a>{% if is_admin_card %}<a href="/management"><span class="icon">▦</span> Management</a>{% endif %}</nav></header>
<main class="auth-page"><form method="post" class="panel auth-card"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><span class="eyebrow">LINKED CARD</span><h1>Add another card</h1><p>This zero-balance card will belong to <strong>{{ card.holder }}</strong> and appear in your card chooser.</p>{% if error %}<div class="notice error">{{ error }}</div>{% endif %}<label>Cardholder<input value="{{ card.holder }}" disabled><small>The authenticated account name is used automatically.</small></label><label>Card label<input name="label" maxlength="80" value="{{ values.get('label','') }}" placeholder="Travel card"></label><label>Currency<select name="currency" id="new-card-currency">{% for currency in ['SGD','USD','EUR','GBP','CNY'] %}<option{% if values.get('currency', card.currency) == currency %} selected{% endif %}>{{ currency }}</option>{% endfor %}</select><small id="detected-currency"></small></label><button class="button primary full" type="submit"><span class="action-icon">＋</span> Create linked card</button><p class="auth-switch"><a href="/account">Cancel and return to account</a></p></form></main><script src="{{ url_for('static', filename='region-currency.js') }}"></script></body></html>

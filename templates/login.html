<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · Bank System</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="nav"><a class="brand" href="/"><span class="icon">◆</span> Bank System</a><nav><a class="active" href="/login"><span class="icon">◉</span> Login</a><a href="/management"><span class="icon">▦</span> Management</a><a href="/api"><span class="icon">⌘</span> API</a></nav></header>
<main class="auth-page"><form method="post" class="panel auth-card"><span class="eyebrow">CARDHOLDER LOGIN</span><h1>Welcome back</h1><p>Enter your 8-digit card number and password to view your account.</p>{% if error %}<div class="notice error">{{ error }}</div>{% endif %}<label>Card number<input name="card_number" inputmode="numeric" autocomplete="cc-number" minlength="8" maxlength="9" required placeholder="4000 0000"></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="button primary full" type="submit"><span class="action-icon">→</span> Log in</button><p class="auth-switch">No card yet? <a href="/register">Create your own card</a> with a zero balance.</p></form></main></body></html>

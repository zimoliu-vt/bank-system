<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · Bank System</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="nav"><a class="brand" href="/">Bank System</a><nav><a class="active" href="/login">Login</a><a href="/management">Management</a><a href="/api">API</a></nav></header>
<main class="auth-page"><form method="post" class="panel auth-card"><span class="eyebrow">CARDHOLDER LOGIN</span><h1>Welcome back</h1><p>Enter your card number and password to view your account.</p>{% if error %}<div class="notice error">{{ error }}</div>{% endif %}<label>Card number<input name="card_number" inputmode="numeric" autocomplete="cc-number" required placeholder="4000 0000 0000 0000"></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="button primary full" type="submit">Log in</button></form></main></body></html>

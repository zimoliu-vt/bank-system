<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Management · Bank System</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="nav"><a class="brand" href="/">Bank System</a><nav><a class="active" href="/management">Management</a><a href="/api">API</a></nav></header>
<main class="page"><div class="page-heading"><span class="eyebrow">ADMIN AREA</span><h1>Cards</h1><p>Create cards and manage their access keys.</p></div>
<section class="panel admin-key-panel"><label for="admin-key">Admin key</label><div class="inline"><input id="admin-key" type="password" autocomplete="off" placeholder="Value from BANK_ADMIN_KEY"><button id="connect" class="button primary">Connect</button></div><small>The key stays in this browser tab and is sent only in the X-Admin-Key header.</small></section>
<div id="notice" class="notice hidden"></div><section class="two-column"><form id="create-form" class="panel"><h2>Add a card</h2><label>Card holder<input name="holder" required maxlength="100" placeholder="Alex Tan"></label><label>Card label<input name="label" maxlength="80" placeholder="Everyday card"></label><div class="form-row"><label>Initial balance<input name="initial_balance" type="number" min="0" step="0.01" value="0"></label><label>Currency<select name="currency"><option>SGD</option><option>USD</option><option>EUR</option><option>GBP</option></select></label></div><button class="button primary" type="submit">Create card</button></form>
<section class="panel"><div class="section-title"><h2>Your cards</h2><button id="refresh" class="text-button">Refresh</button></div><div id="cards" class="card-list"><p class="muted">Enter the admin key to load cards.</p></div></section></section></main>
<dialog id="key-dialog"><h2>Save this API key</h2><p>This is the only time the raw key will be displayed.</p><code id="new-key"></code><div class="actions"><button id="copy-key" class="button primary">Copy key</button><button id="close-dialog" class="button">I saved it</button></div></dialog><script src="{{ url_for('static', filename='management.js') }}"></script></body></html>
